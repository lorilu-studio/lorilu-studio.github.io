<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <title>Lorilu Studio</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.7 system-ui, sans-serif; }
    body { max-width: 42rem; margin: 12vh auto; padding: 0 1.25rem; color: #242424; background: #f5f5f5; }
    main { padding: 2.5rem; border: 1px solid #ddd; border-radius: 1rem; background: #fff; }
    h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: -.04em; }
    p { color: #555; }
    a { color: #0969da; }
    @media (prefers-color-scheme: dark) {
      body { color: #eee; background: #111; }
      main { border-color: #333; background: #1b1b1b; }
      p { color: #bbb; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Lorilu Studio</h1>
    <p>你好，这里是我的个人主页。内容正在整理中。</p>
    <p><a href="https://github.com/lorilu-studio">在 GitHub 查看我的项目</a></p>
  </main>
</body>
</html>
